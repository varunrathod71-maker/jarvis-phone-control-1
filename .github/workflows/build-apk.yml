name: Build JARVIS APK

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      yes | sdkmanager --licenses
      sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Extract JARVIS ZIP if needed
    shell: bash
    run: |
      if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
        echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      else
        ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit)"

        if [ -z "$ZIP_FILE" ]; then
          echo "::error::No JARVIS ZIP found in the repository."
          exit 1
        fi

        mkdir -p "$GITHUB_WORKSPACE/extracted"
        unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

        SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

        if [ -z "$SETTINGS_FILE" ]; then
          echo "::error::No settings.gradle found inside the ZIP. Check that the ZIP contains the Android project."
          exit 1
        fi

        PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
        echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      fi

  - name: Build Android APK
    run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: jarvis-debug-apk
      path: '**/app/build/outputs/apk/debug/app-debug.apk'
      if-no-files-found: error
